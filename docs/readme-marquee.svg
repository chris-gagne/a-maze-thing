    <text x="600" y="142" fill="#ffb629" font-family="monospace" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="3">ENDLESS DIGITAL LABYRINTH</text>
    <text x="600" y="198" fill="#f3fffe" font-family="monospace" font-size="51" font-weight="900" text-anchor="middle">A-MAZE-THING</text>
