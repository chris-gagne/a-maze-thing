<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description" shape-rendering="crispEdges">
  <title id="title">A-Maze-Thing</title>
  <desc id="description">A dense digital maze scattered with the player, enemies, coins, hazards, portals, and an exit.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#42e8df" stroke-opacity=".055"/>
